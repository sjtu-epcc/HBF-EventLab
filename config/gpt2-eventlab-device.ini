# Provisional multi-bank GPT-2 study geometry, based on EventLab's
# demonstration profile. 16 channels x 8192 resident pages/channel.
# This is an experiment assumption, not a finalized HBF product geometry.
[device.geometry]
host_channels=16
dies_per_channel=4
banks_per_die=16
pages_per_block=8
blocks_per_bank=16
spare_blocks_per_bank=2

[device]
ucie_speed_grade=3
[device.capabilities]
mocs_supported=256
max_pending_write_dlus=32
read_burst=false
write_burst=true
[device.selected]
mocs_selected=256
assembly_timeout_ps=1000000000
zone_size_dlus=auto
[address]
global_base=0
interleave_bytes=4096
[host]
send_policy=fcfs
write_mode=burst4096
read_hint_mode=tail_batch
max_open_dlus_per_channel=8
max_resident_fragments=4096
max_logical_fragments=0
[execution.media_timing]
sense_ps=15000000
program_ps=200000000
erase_ps=2000000000
cache_access_ps=100
[run]
max_tick_ps=none
total_events=0
events_per_tick=100000
rounds_per_tick=100000
