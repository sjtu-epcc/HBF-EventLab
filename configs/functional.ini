# Compact functional model. Omitted fields retain documented defaults.
# All execution durations use picoseconds. This is not a calibrated product.
[device]
spec_profile = ocp_hbf_v0.7.0
ucie_speed_grade = 1

[device.geometry]
host_channels = 2
dies_per_channel = 1
banks_per_die = 1
pages_per_block = 8
blocks_per_bank = 4
spare_blocks_per_bank = 1

[device.capabilities]
mocs_supported = 256
max_pending_write_dlus = 8
read_burst = false
write_burst = true

[device.selected]
mocs_selected = 256
assembly_timeout_ps = 10000000
zone_size_dlus = auto

[address]
global_base = 0
interleave_bytes = 64

[host]
send_policy = fill_open
write_mode = fragment64
read_hint_mode = tail_batch
max_open_dlus_per_channel = 2

[execution.read_dispatch]
policy = window
wait_ps = 10000
threshold = 32

[execution.nand_scheduler]
policy = fcfs

[execution.ucie_scheduler]
policy = fifo
