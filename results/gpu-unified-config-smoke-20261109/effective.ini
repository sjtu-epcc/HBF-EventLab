# HBF EventLab effective configuration, format 1; OCP profile is a modeled subset.
# Fixed Tick = 1 ps. Timing/overhead/buffer defaults are uncalibrated model choices.
# Derived effective_GBps_per_direction_per_module = 188
# Derived max_ucie_modules = 16; max_stack_height = 16
# Derived channel_bytes = 33554432; total_logical_bytes = 536870912
# Derived assembly_payload_bytes_per_channel = 131072
# Fixed bank_operation_slots = 1; cache_pages_per_bank = 2; Core Channel = ideal

[address]
global_base = 0
interleave_bytes = 4096

[device.capabilities]
max_pending_write_dlus = 32
mocs_supported = 256
read_burst = false
write_burst = true

[device.capacity_policy]
max_hole_permille = 50

[device.geometry]
banks_per_die = 16
blocks_per_bank = 16
dies_per_channel = 4
host_channels = 16
pages_per_block = 8
spare_blocks_per_bank = 2

[device.selected]
assembly_timeout_ps = 1000000000
mocs_selected = 256
zone_size_dlus = 512

[device]
spec_profile = "ocp_hbf_v0.7.0"

[device.topology]
core_channels_per_ucie = 1
die_to_core_channel = [0, 0, 0, 0]

[device]
ucie_speed_grade = 3

[execution.buffers]
egress_entries = 8
egress_payload_bytes = 512
ingress_entries = 16
ingress_payload_bytes = 16384

[execution.media_timing]
cache_access_ps = 100
erase_ps = 2000000000
program_ps = 200000000
sense_ps = 15000000

[execution.nand_scheduler]
policy = "fcfs"

[execution.read_dispatch]
policy = "window"
threshold = 32
wait_ps = 10000

[execution.ucie]
request_control_bytes = 16
request_fixed_latency_ps = 100
response_control_bytes = 16
response_fixed_latency_ps = 100

[execution.ucie_scheduler]
policy = "fifo"

[faults]
bank = 0
block = 0
channel = 0
die = 0
fail_sequence = []
persistent_page = none

[host]
max_logical_fragments = 0
max_open_dlus_per_channel = 8
max_resident_fragments = 4096
read_hint_mode = tail_batch

[host.recovery]
max_replay_passes = 3

[host]
retained_fragments = 65536

[host.retry]
max_pending_retries = 3
max_timeout_retries = 3
pending_delay_ps = 1000000

[host]
send_policy = "fcfs"
write_mode = burst4096

[output]
effective_config = ""
runtime_profile_json = ""
statistics_buffer_bytes = 65536
statistics_events_jsonl = ""
statistics_json = ""
trace = false

[run]
events_per_tick = 100000
max_tick_ps = none
rounds_per_tick = 100000
total_events = 0
